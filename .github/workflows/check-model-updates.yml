name: Check forecast model updates

on:
  schedule:
    - cron: "35 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check official model sources
        run: python scripts/check_model_updates.py --auto-adopt-compatible
      - name: Commit compatible model updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modelRegistry.ts public/model_update_report.json
          if git diff --cached --quiet; then
            echo "No model registry changes to commit"
            exit 0
          fi
          git commit -m "Update compatible forecast model registry"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
