name: Update CWA rain probability

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repository-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate CWA rain probability JSON
        run: |
          python scripts/generate_cwa_rain_probability.py --output docs/cwa_rain_probability.json
          cp docs/cwa_rain_probability.json public/cwa_rain_probability.json
      - name: Commit updated CWA rain probability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cwa_rain_probability.json public/cwa_rain_probability.json
          if git diff --cached --quiet; then
            echo "No CWA rain probability changes to commit"
            exit 0
          fi
          git commit -m "Update CWA rain probability JSON"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
