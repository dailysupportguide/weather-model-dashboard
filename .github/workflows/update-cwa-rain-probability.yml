name: Update CWA rain probability

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate CWA rain probability JSON
        run: |
          python scripts/generate_cwa_rain_probability.py --output docs/cwa_rain_probability.json
          cp docs/cwa_rain_probability.json public/cwa_rain_probability.json
      - name: Commit updated CWA rain probability
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update CWA rain probability JSON
          file_pattern: docs/cwa_rain_probability.json public/cwa_rain_probability.json
